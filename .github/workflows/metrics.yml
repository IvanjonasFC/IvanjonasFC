# Colócalo en tu repo de perfil (IvanjonasFC/IvanjonasFC) en:
#   .github/workflows/metrics.yml
# Genera y committea github-metrics.svg → el README lo enlaza y NUNCA se rompe.
name: Metrics
on:
  schedule: [{ cron: "0 6 * * *" }]   # cada día a las 06:00 UTC
  workflow_dispatch:                   # botón para ejecutarlo a mano
  # OJO: sin disparador 'push'. Como el commit del SVG usa tu PAT, un 'push'
  # aquí crearía un bucle infinito de ejecuciones.

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # PAT (classic) guardado como secreto del repo. Scope: repo (o public_repo).
          token: ${{ secrets.METRICS_TOKEN }}
          user: IvanjonasFC
          filename: github-metrics.svg
          template: classic
          base: header, activity
          config_timezone: Europe/Madrid
          # Tarjeta compacta: sin 'repositories' ni 'languages' (ya está el Tech Stack).
